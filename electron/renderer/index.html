<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
  <title>Creaters Tool Engineer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #0f0f1a;
      color: #d0d0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: #1a1a30;
      padding: 10px 16px;
      border-bottom: 1px solid #2a2a45;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 0.95rem; font-weight: 600; color: #a0c8ff; flex: 1; }
    .header-right { display: flex; align-items: center; gap: 8px; }

    /* ── Status bar ── */
    .status-bar {
      background: #151525;
      border-bottom: 1px solid #2a2a45;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      font-size: 0.8rem;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.inactive { background: #555; }
    .dot.pending  { background: #ffd54f; animation: blink 1s infinite; }
    .dot.active   { background: #69f0ae; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-label { color: #aaa; flex: 1; }

    /* ── Settings panel (collapsible) ── */
    .settings-panel {
      background: #13132a;
      border-bottom: 1px solid #2a2a45;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .settings-panel.hidden { display: none; }

    label { font-size: 0.75rem; color: #888; margin-bottom: 2px; display: block; }

    select {
      width: 100%;
      padding: 8px 10px;
      background: #1a1a30;
      color: #d0d0e0;
      border: 1px solid #3a3a55;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    select:focus { border-color: #a0c8ff; }
    select:disabled { opacity: 0.5; }

    .btn-row { display: flex; gap: 6px; }
    .btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-start  { background: #4fc3f7; color: #000; }
    .btn-stop   { background: #ef5350; color: #fff; }
    .btn-sm     { background: #2a2a45; color: #a0c8ff; font-size: 0.75rem; padding: 5px 10px; flex: none; }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0f0f1a;
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .bubble-wrap.user { align-self: flex-end; align-items: flex-end; }
    .bubble-wrap.bot  { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-wrap.user .bubble {
      background: #4fc3f7;
      color: #000;
      border-bottom-right-radius: 4px;
    }
    .bubble-wrap.bot .bubble {
      background: #1e1e38;
      color: #d8d8f0;
      border-bottom-left-radius: 4px;
      border: 1px solid #2a2a50;
    }

    .bubble-time {
      font-size: 0.68rem;
      color: #555;
      margin-top: 3px;
      padding: 0 4px;
    }

    .typing-indicator {
      align-self: flex-start;
      display: flex;
      gap: 4px;
      padding: 10px 14px;
      background: #1e1e38;
      border: 1px solid #2a2a50;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
    }
    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #666;
      animation: typingBounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    /* ── Input area ── */
    .input-area {
      background: #1a1a30;
      border-top: 1px solid #2a2a45;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      background: #0f0f1a;
      color: #d0d0e0;
      border: 1px solid #3a3a55;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.4;
      font-family: inherit;
    }
    .chat-input:focus { border-color: #4fc3f7; }
    .btn-send {
      background: #4fc3f7;
      color: #000;
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-send:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Log (collapsible) ── */
    .log-section { flex-shrink: 0; }
    .log-toggle {
      background: #13132a;
      border-top: 1px solid #2a2a45;
      padding: 5px 14px;
      font-size: 0.72rem;
      color: #666;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .log-toggle:hover { color: #999; }
    .log {
      background: #0a0a14;
      border-top: 1px solid #1a1a2a;
      padding: 8px 10px;
      overflow-y: auto;
      font-size: 0.7rem;
      font-family: 'Consolas', monospace;
      color: #666;
      max-height: 100px;
      display: none;
    }
    .log.open { display: block; }
    .log-line { line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .log-line.err { color: #ef9a9a; }

    /* ── Webhook bar ── */
    .webhook-bar {
      display: none;
      background: #0d1f12;
      border-top: 1px solid #2a4a30;
      padding: 5px 12px;
      font-size: 0.7rem;
      gap: 6px;
      align-items: center;
    }
    .webhook-bar.visible { display: flex; }
    .webhook-label { color: #4caf50; white-space: nowrap; font-weight: 600; }
    .webhook-url {
      flex: 1; color: #a5d6a7;
      font-family: 'Consolas', monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-copy {
      background: #1a3a20; color: #4caf50;
      border: 1px solid #2a4a30; border-radius: 4px;
      padding: 2px 7px; font-size: 0.68rem; cursor: pointer; white-space: nowrap;
    }

    .header-icon { font-size: 1.2rem; }
    .hidden-btn  { display: none; }

    /* ── Setup modal ── */
    .setup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .setup-overlay.visible { display: flex; }
    .setup-modal {
      background: #1a1a30;
      border: 1px solid #3a3a55;
      border-radius: 10px;
      padding: 24px 22px 20px;
      width: 420px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .setup-modal h2 {
      font-size: 1rem;
      color: #a0c8ff;
      margin: 0;
    }
    .setup-modal p {
      font-size: 0.82rem;
      color: #999;
      line-height: 1.5;
      margin: 0;
    }
    .setup-path-row {
      display: flex;
      gap: 6px;
    }
    .setup-path-input {
      flex: 1;
      background: #0f0f1a;
      color: #d0d0e0;
      border: 1px solid #3a3a55;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      outline: none;
      font-family: 'Consolas', monospace;
    }
    .setup-path-input:focus { border-color: #a0c8ff; }
    .setup-btn-browse {
      background: #2a2a45;
      color: #a0c8ff;
      border: 1px solid #3a3a55;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .setup-btn-browse:hover { background: #323258; }
    .setup-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .setup-btn-save {
      background: #4fc3f7;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 9px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .setup-btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
    .setup-btn-skip {
      background: transparent;
      color: #666;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .setup-btn-skip:hover { color: #999; border-color: #555; }
    .setup-error { font-size: 0.78rem; color: #ef9a9a; }
    .setup-error.hidden { display: none; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="header-icon">🤖</span>
    <h1>Creaters Tool Engineer</h1>
    <div class="header-right">
      <button type="button" class="btn btn-sm" id="btnToggleSettings" title="設定">⚙ 設定</button>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="dot inactive" id="statusDot"></div>
    <span class="status-label" id="statusText">停止中</span>
  </div>

  <!-- Settings panel (collapsible) -->
  <div class="settings-panel hidden" id="settingsPanel">
    <div>
      <label>対応 LINE アカウント</label>
      <select id="userSelect">
        <option value="">-- 読み込み中... --</option>
      </select>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-start" id="btnStart" disabled>認証して起動</button>
      <button type="button" class="btn btn-stop hidden-btn" id="btnStop">停止</button>
      <button type="button" class="btn btn-sm" id="btnRefresh">更新</button>
      <button type="button" class="btn btn-sm" id="btnPathSettings" title="プロジェクトフォルダを変更">📁 パス</button>
    </div>
    <div class="webhook-bar" id="webhookBar">
      <span class="webhook-label">Webhook</span>
      <span class="webhook-url" id="webhookUrl"></span>
      <button type="button" class="btn-copy" id="btnCopyWebhook">コピー</button>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea"></div>

  <!-- Input area -->
  <div class="input-area">
    <textarea class="chat-input" id="chatInput" rows="1"
      placeholder="メッセージを入力（LINE と同じコマンドが使えます）"></textarea>
    <button type="button" class="btn-send" id="btnSend" title="送信">➤</button>
  </div>

  <!-- Log (collapsible) -->
  <div class="log-section">
    <div class="log-toggle" id="logToggle">▶ ログ</div>
    <div class="log" id="log"></div>
  </div>

  <!-- Setup modal (first-run / path change) -->
  <div class="setup-overlay" id="setupOverlay">
    <div class="setup-modal">
      <h2>📁 プロジェクトフォルダの設定</h2>
      <p>Git リポジトリが保存されているフォルダを指定してください。<br>
         複数のパスはセミコロン（;）で区切って入力できます。</p>
      <div class="setup-path-row">
        <input type="text" class="setup-path-input" id="setupPathInput"
               placeholder="例: D:\Project" spellcheck="false">
        <button type="button" class="setup-btn-browse" id="btnSetupBrowse">参照...</button>
      </div>
      <div class="setup-error hidden" id="setupError"></div>
      <div class="setup-footer">
        <button type="button" class="setup-btn-skip" id="btnSetupSkip">後で設定する</button>
        <button type="button" class="setup-btn-save" id="btnSetupSave" disabled>保存して続行</button>
      </div>
    </div>
  </div>

  <script>
    const api = window.electronAPI;

    // ── State ──
    let activeUserId = '';
    let isSending = false;
    let logOpen = false;

    // ── Elements ──
    const statusDot       = document.getElementById('statusDot');
    const statusText      = document.getElementById('statusText');
    const settingsPanel   = document.getElementById('settingsPanel');
    const btnToggleSettings = document.getElementById('btnToggleSettings');
    const userSelect      = document.getElementById('userSelect');
    const btnStart        = document.getElementById('btnStart');
    const btnStop         = document.getElementById('btnStop');
    const btnRefresh      = document.getElementById('btnRefresh');
    const webhookBar      = document.getElementById('webhookBar');
    const webhookUrlEl    = document.getElementById('webhookUrl');
    const btnCopyWebhook  = document.getElementById('btnCopyWebhook');
    const chatArea        = document.getElementById('chatArea');
    const chatInput       = document.getElementById('chatInput');
    const btnSend         = document.getElementById('btnSend');
    const logToggle       = document.getElementById('logToggle');
    const logEl           = document.getElementById('log');

    // ── Log ──
    function addLog(msg) {
      const line = document.createElement('div');
      line.className = 'log-line' + (msg.includes('[ERR]') || msg.includes('[ERROR]') || msg.includes('[FATAL]') ? ' err' : '');
      const now = new Date().toLocaleTimeString('ja-JP');
      line.textContent = `[${now}] ${msg}`;
      logEl.appendChild(line);
      if (logOpen) logEl.scrollTop = logEl.scrollHeight;
    }

    api.onLog(addLog);

    logToggle.addEventListener('click', () => {
      logOpen = !logOpen;
      logEl.classList.toggle('open', logOpen);
      logToggle.textContent = (logOpen ? '▼' : '▶') + ' ログ';
      if (logOpen) logEl.scrollTop = logEl.scrollHeight;
    });

    // ── Webhook bar ──
    function applyServerInfo(info) {
      if (info && info.webhookUrl) {
        webhookUrlEl.textContent = info.webhookUrl;
        webhookBar.classList.add('visible');
      }
    }
    api.onServerInfo(applyServerInfo);
    btnCopyWebhook.addEventListener('click', () => {
      const url = webhookUrlEl.textContent;
      if (url) {
        navigator.clipboard.writeText(url).then(() => {
          btnCopyWebhook.textContent = 'コピー済み';
          setTimeout(() => { btnCopyWebhook.textContent = 'コピー'; }, 1500);
        });
      }
    });

    // ── Settings panel ──
    btnToggleSettings.addEventListener('click', () => {
      settingsPanel.classList.toggle('hidden');
    });

    // ── Status ──
    function applyStatus(status, selectedUserId) {
      statusDot.className = 'dot ' + status.toLowerCase();
      const labels = { INACTIVE: '停止中', PENDING_OTP: 'OTP 認証待ち', ACTIVE: '稼働中' };
      const uid = selectedUserId ? ` (…${selectedUserId.slice(-8)})` : '';
      statusText.textContent = (labels[status] || status) + uid;

      activeUserId = selectedUserId || '';

      if (status === 'ACTIVE') {
        btnStart.classList.add('hidden-btn');
        btnStop.classList.remove('hidden-btn');
        userSelect.disabled    = true;
      } else if (status === 'PENDING_OTP') {
        btnStart.disabled      = true;
        btnStop.classList.add('hidden-btn');
        btnStart.classList.remove('hidden-btn');
        btnStart.textContent   = 'OTP 送信済み（LINE を確認）';
        userSelect.disabled    = true;
      } else {
        btnStart.classList.remove('hidden-btn');
        btnStop.classList.add('hidden-btn');
        btnStart.disabled      = !userSelect.value;
        btnStart.textContent   = '認証して起動';
        userSelect.disabled    = false;
      }
    }

    async function loadUsers() {
      try {
        const data = await api.getUsers();
        const users = data.users || [];
        userSelect.innerHTML = users.length === 0
          ? '<option value="">-- LINE でメッセージを送るとここに表示されます --</option>'
          : '<option value="">-- アカウントを選択 --</option>' +
            users.map(u => `<option value="${u.userId}">${u.displayName || u.userId.slice(-12)} （${u.messageCount}件）</option>`).join('');
        btnStart.disabled = !userSelect.value;
      } catch {
        userSelect.innerHTML = '<option value="">⚠ 読み込みエラー</option>';
        btnStart.disabled = true;
      }
    }

    async function pollStatus() {
      const data = await api.getStatus().catch(() => ({ status: 'INACTIVE' }));
      applyStatus(data.status || 'INACTIVE', data.selectedUserId);
    }

    userSelect.addEventListener('change', () => {
      if (!statusDot.className.includes('active')) btnStart.disabled = !userSelect.value;
    });

    btnStart.addEventListener('click', async () => {
      const userId = userSelect.value;
      if (!userId) return;
      btnStart.disabled = true;
      addLog(`${userId} へ認証コードを送信中...`);
      const result = await api.startSession(userId);
      addLog(result.message || JSON.stringify(result));
      await pollStatus();
    });

    btnStop.addEventListener('click', async () => {
      btnStop.disabled = true;
      addLog('セッションを停止中...');
      const result = await api.stopSession();
      addLog(result.message || JSON.stringify(result));
      await pollStatus();
      btnStop.disabled = false;
    });

    btnRefresh.addEventListener('click', async () => {
      btnRefresh.disabled = true;
      await loadUsers();
      btnRefresh.disabled = false;
    });

    // ── Chat ──
    function now() {
      return new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }

    function appendBubble(role, text) {
      const wrap = document.createElement('div');
      wrap.className = `bubble-wrap ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const time = document.createElement('div');
      time.className = 'bubble-time';
      time.textContent = now();

      wrap.appendChild(bubble);
      wrap.appendChild(time);
      chatArea.appendChild(wrap);
      chatArea.scrollTop = chatArea.scrollHeight;
      return wrap;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'typing-indicator';
      el.id = 'typingIndicator';
      el.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      chatArea.appendChild(el);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function hideTyping() {
      document.getElementById('typingIndicator')?.remove();
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isSending) return;

      isSending = true;
      btnSend.disabled = true;
      chatInput.value = '';
      chatInput.style.height = '';

      appendBubble('user', text);
      showTyping();

      try {
        const userId = activeUserId || 'LOCAL_PC_USER';
        const result = await api.sendChat(text, userId);
        hideTyping();

        const msgs = result.messages || [];
        if (msgs.length === 0) {
          appendBubble('bot', '（応答なし）');
        } else {
          for (const msg of msgs) {
            appendBubble('bot', msg);
            // Short delay between multi-part messages for readability
            if (msgs.length > 1) await new Promise(r => setTimeout(r, 120));
          }
        }
      } catch (err) {
        hideTyping();
        appendBubble('bot', `❌ 送信エラー: ${err}`);
      } finally {
        isSending = false;
        btnSend.disabled = false;
        chatInput.focus();
      }
    }

    btnSend.addEventListener('click', sendMessage);

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    chatInput.addEventListener('input', () => {
      chatInput.style.height = '';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
    });

    // ── Welcome message ──
    function showWelcome() {
      appendBubble('bot',
        'こんにちは！PC チャットから操作できます。\n\n' +
        'LINE と同じコマンドが使えます:\n' +
        '・リポジトリ一覧\n' +
        '・<名前>を選択\n' +
        '・プランモード: <指示>\n' +
        '・新規リポジトリ: <名前>\n' +
        '・チーム提案: <説明>\n\n' +
        '⚙ 設定 ボタンから LINE アカウントと連携できます。'
      );
    }

    // ── Setup modal ──
    const setupOverlay   = document.getElementById('setupOverlay');
    const setupPathInput = document.getElementById('setupPathInput');
    const btnSetupBrowse = document.getElementById('btnSetupBrowse');
    const btnSetupSave   = document.getElementById('btnSetupSave');
    const btnSetupSkip   = document.getElementById('btnSetupSkip');
    const setupError     = document.getElementById('setupError');
    const btnPathSettings = document.getElementById('btnPathSettings');

    function showSetupModal() {
      api.setup.getReposPaths().then((current) => {
        setupPathInput.value = current || '';
        btnSetupSave.disabled = !setupPathInput.value.trim();
        setupError.textContent = '';
        setupError.classList.add('hidden');
        setupOverlay.classList.add('visible');
      });
    }

    function hideSetupModal() {
      setupOverlay.classList.remove('visible');
    }

    setupPathInput.addEventListener('input', () => {
      btnSetupSave.disabled = !setupPathInput.value.trim();
    });

    btnSetupBrowse.addEventListener('click', async () => {
      const picked = await api.setup.pickFolder();
      if (picked) {
        const existing = setupPathInput.value.trim();
        setupPathInput.value = existing
          ? existing.split(';').map(s => s.trim()).concat(picked).join(';')
          : picked;
        btnSetupSave.disabled = false;
      }
    });

    btnSetupSave.addEventListener('click', async () => {
      const paths = setupPathInput.value.trim();
      if (!paths) return;
      btnSetupSave.disabled = true;
      const result = await api.setup.saveReposPaths(paths);
      if (result.ok) {
        addLog(`[Setup] プロジェクトフォルダを設定しました: ${paths}`);
        hideSetupModal();
      } else {
        setupError.textContent = `保存に失敗しました: ${result.error || '不明なエラー'}`;
        setupError.classList.remove('hidden');
        btnSetupSave.disabled = false;
      }
    });

    btnSetupSkip.addEventListener('click', hideSetupModal);

    btnPathSettings.addEventListener('click', showSetupModal);

    // ── Init ──
    loadUsers();
    pollStatus();
    api.getServerInfo().then(applyServerInfo);
    showWelcome();
    setInterval(pollStatus, 3000);

    // 初回起動時にセットアップモーダルを表示
    api.setup.isFirstRun().then((isFirst) => {
      if (isFirst) showSetupModal();
    });
  </script>
</body>
</html>
